<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Login · JP Poolparty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap" />
    <link rel="stylesheet" href="css/scrapbook.css?v=20261110" />
    <link rel="stylesheet" href="css/auth.css?v=20261110" />
    <meta name="theme-color" content="#fdfbf7" />
    <meta name="api-base" content="https://jpcore.logge.top" />
  </head>
  <body class="auth-page">
    <nav class="split-nav">
      <div class="nav-brand">
        <h3><a href="/">JP Poolparty</a></h3>
      </div>
    </nav>

    <main class="auth-main">
    <div class="auth-card">
        <h1 class="caption">Login</h1>

      <form id="loginForm" autocomplete="on" novalidate>
        <div class="form-section">
          <div class="form-group">
            <label for="emailInput">E-Mail</label>
            <input
              id="emailInput"
              class="input-block"
              type="email"
              name="email"
              autocomplete="username"
              required
            />
          </div>
          <div class="form-group">
            <label for="passwordInput">Passwort</label>
            <input
              id="passwordInput"
              class="input-block"
              type="password"
              name="password"
              autocomplete="current-password"
              required
            />
          </div>

          <div id="loginError" class="alert auth-message" role="alert" style="display:none;color:var(--accent)"></div>

          <div class="form-actions">
            <button type="submit" class="btn-large btn-block btn-cta" id="submitLogin">
              Einloggen
            </button>
          </div>

          <p class="auth-links">
            <a href="/forgot-password.html">Passwort vergessen?</a>
          </p>
          <p class="auth-help">
            Wenn etwas nicht klappt, schreib uns: <a href="mailto:poolparty.jupeters@gmail.com">poolparty.jupeters@gmail.com</a>
          </p>
        </div>
      </form>
    </div>
    </main>

    <script type="module">
      import { login } from './js/api/auth.js';
      import { ApiError } from './js/api/client.js';

      const form = document.getElementById('loginForm');
      const errorEl = document.getElementById('loginError');
      const submitBtn = document.getElementById('submitLogin');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.style.display = 'none';
        submitBtn.disabled = true;
        const originalLabel = submitBtn.innerText;
        submitBtn.innerText = 'Wird angemeldet…';

        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value;

        try {
          await login(email, password);
          window.location.href = '/';
        } catch (err) {
          errorEl.textContent =
            err instanceof ApiError ? err.message : 'Unbekannter Fehler beim Anmelden.';
          errorEl.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerText = originalLabel;
        }
      });
    </script>
  </body>
</html>
