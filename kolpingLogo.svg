<svg
  id="Kolping_Logo"
  xmlns="http://www.w3.org/2000/svg"
  width="200"
  height="200"
  viewBox="0 0 200 200"
>
  <defs>
    <!-- Anniversary palette: the seven original recap colours, top to bottom. -->
    <linearGradient id="kolping-rainbow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200" color-interpolation="sRGB"><stop offset="0%" stop-color="#FF0000"/>
    <stop offset="7%" stop-color="#FF0000"/>
    <stop offset="20%" stop-color="#F5601D"/>
    <stop offset="23%" stop-color="#F5601D"/>
    <stop offset="34%" stop-color="#E0E722"/>
    <stop offset="38%" stop-color="#E0E722"/>
    <stop offset="49%" stop-color="#6BE607"/>
    <stop offset="53%" stop-color="#6BE607"/>
    <stop offset="64%" stop-color="#51FCF8"/>
    <stop offset="68%" stop-color="#51FCF8"/>
    <stop offset="79%" stop-color="#D800FF"/>
    <stop offset="83%" stop-color="#D800FF"/>
    <stop offset="96%" stop-color="#FF2D87"/>
    <stop offset="100%" stop-color="#FF2D87"/></linearGradient>
    <style>
      <![CDATA[
      #Kolping_Logo {
        display: block;
        margin: auto;
        fill: black;
        height: 300px;
        width: auto;
      }

      #Kolping_Logo path {
        stroke: #000;
        animation: drawKolping 4s 1 ease-in-out;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
      }

      @keyframes drawKolping {
        0% {
          stroke-dashoffset: 1000;
          fill-opacity: 0;
        }

        30% {
          fill-opacity: 0;
        }

        85% {
          stroke-dashoffset: 0;
        }

        100% {
          fill-opacity: 1;
          stroke-dashoffset: 0;
        }
      }
      ]]>
    </style>
  </defs>
  <path fill="url(#kolping-rainbow)" d="M0,0H200V200H0" />
  <path d="M0,0H60V200H0M60,100 200,0V200" />
</svg> 