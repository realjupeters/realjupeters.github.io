<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Passwort zurücksetzen · JP Poolparty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap" />
    <link rel="stylesheet" href="css/scrapbook.css?v=20261110" />
    <link rel="stylesheet" href="css/auth.css?v=20261110" />
    <meta name="theme-color" content="#fdfbf7" />
    <meta name="api-base" content="https://jpcore.logge.top" />
  </head>
  <body class="auth-page">
    <nav class="split-nav">
      <div class="nav-brand">
        <h3><a href="/">JP Poolparty</a></h3>
      </div>
    </nav>

    <main class="auth-main">
    <div class="auth-card">
        <h1 class="caption">Neues Passwort</h1>

      <div id="missingTokenWarning" style="display:none">
        <div class="form-section">
          <p class="auth-warning">
            Kein Reset-Token in der URL gefunden. Bitte folge dem Link aus deiner E-Mail.
          </p>
          <p class="auth-links">
            <a href="/forgot-password.html">Neuen Link anfordern</a>
          </p>
        </div>
      </div>

      <form id="resetForm" novalidate>
        <div class="form-section">
          <p class="auth-intro">
            Wähl ein neues Passwort (mindestens 8 Zeichen). Alle laufenden Sitzungen
            werden danach abgemeldet.
          </p>

          <div class="form-group">
            <label for="passwordInput">Neues Passwort</label>
            <input
              id="passwordInput"
              class="input-block"
              type="password"
              name="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </div>
          <div class="form-group">
            <label for="passwordConfirm">Passwort bestätigen</label>
            <input
              id="passwordConfirm"
              class="input-block"
              type="password"
              name="passwordConfirm"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </div>

          <div id="resetMessage" class="alert auth-message" role="status" style="display:none"></div>

          <div class="form-actions">
            <button type="submit" class="btn-large btn-block btn-cta" id="submitNewPassword">
              Passwort speichern
            </button>
          </div>
        </div>
      </form>
    </div>
    </main>

    <script type="module">
      import { resetPassword } from './js/api/auth.js';
      import { ApiError } from './js/api/client.js';

      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      const form = document.getElementById('resetForm');
      const warning = document.getElementById('missingTokenWarning');
      const messageEl = document.getElementById('resetMessage');
      const submitBtn = document.getElementById('submitNewPassword');

      if (!token) {
        form.style.display = 'none';
        warning.style.display = 'block';
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        messageEl.style.display = 'none';

        const pw = document.getElementById('passwordInput').value;
        const pwConfirm = document.getElementById('passwordConfirm').value;

        if (pw.length < 8) {
          messageEl.style.color = 'var(--accent)';
          messageEl.textContent = 'Passwort muss mindestens 8 Zeichen haben.';
          messageEl.style.display = 'block';
          return;
        }
        if (pw !== pwConfirm) {
          messageEl.style.color = 'var(--accent)';
          messageEl.textContent = 'Passwörter stimmen nicht überein.';
          messageEl.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        const originalLabel = submitBtn.innerText;
        submitBtn.innerText = 'Wird gespeichert…';

        try {
          await resetPassword(token, pw);
          messageEl.style.color = 'var(--success)';
          messageEl.textContent = 'Passwort geändert. Du wirst zum Login geleitet…';
          messageEl.style.display = 'block';
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1500);
        } catch (err) {
          messageEl.style.color = 'var(--accent)';
          messageEl.textContent =
            err instanceof ApiError ? err.message : 'Unbekannter Fehler.';
          messageEl.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerText = originalLabel;
        }
      });
    </script>
  </body>
</html>
