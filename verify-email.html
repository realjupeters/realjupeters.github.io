<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>E-Mail bestätigen · JP Poolparty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap" />
    <link rel="stylesheet" href="css/scrapbook.css?v=20261110" />
    <link rel="stylesheet" href="css/auth.css?v=20261110" />
    <meta name="theme-color" content="#fdfbf7" />
    <meta name="api-base" content="https://jpcore.logge.top" />
  </head>
  <body class="auth-page">
    <nav class="split-nav">
      <div class="nav-brand">
        <h3><a href="/">JP Poolparty</a></h3>
      </div>
    </nav>

    <main class="auth-main">
    <div class="auth-card">
        <h1 class="caption">E-Mail bestätigen</h1>

      <div class="form-section">
        <p id="verifyStatus" class="auth-status">
          Deine E-Mail wird bestätigt…
        </p>
        <div id="verifyMessage" class="alert auth-message" role="status" style="display:none"></div>
      </div>
    </div>
    </main>

    <script type="module">
      import { verifyEmail } from './js/api/auth.js';
      import { ApiError } from './js/api/client.js';

      const token = new URLSearchParams(window.location.search).get('token');
      const statusEl = document.getElementById('verifyStatus');
      const messageEl = document.getElementById('verifyMessage');

      if (!token) {
        statusEl.textContent = 'Kein Verifikations-Token gefunden. Bitte nutze den Link aus der E-Mail.';
      } else {
        (async () => {
          try {
            await verifyEmail(token);
            messageEl.style.color = 'var(--success)';
            messageEl.textContent = 'E-Mail erfolgreich bestätigt. Du wirst gleich weitergeleitet…';
            messageEl.style.display = 'block';
            statusEl.textContent = 'Erfolgreich.';
            setTimeout(() => {
              window.location.href = '/';
            }, 1500);
          } catch (err) {
            messageEl.style.color = 'var(--accent)';
            messageEl.textContent = err instanceof ApiError ? err.message : 'Unbekannter Fehler.';
            messageEl.style.display = 'block';
            statusEl.textContent = 'Bestätigung fehlgeschlagen.';
          }
        })();
      }
    </script>
  </body>
</html>
