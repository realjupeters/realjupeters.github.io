<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Passwort vergessen · Poolparty 2026</title>
    <link rel="stylesheet" href="css/main.css" />
    <meta name="theme-color" content="#fdfbf7" />
    <meta name="api-base" content="https://jpcore.logge.top" />
  </head>
  <body>
    <nav class="border split-nav fixed">
      <div class="nav-brand">
        <h3><a href="/">JP Poolparty</a></h3>
      </div>
    </nav>

    <div class="paper">
      <div class="row flex-center">
        <h1 class="caption">Passwort vergessen</h1>
      </div>

      <form id="resetRequestForm" novalidate>
        <div class="form-section">
          <p style="font-size:1.05rem;">
            Trag deine E-Mail ein. Wenn ein Konto existiert, schicken wir dir einen
            Link zum Zurücksetzen (gültig 1 Stunde).
          </p>

          <div class="form-group">
            <label for="emailInput">E-Mail</label>
            <input
              id="emailInput"
              class="input-block"
              type="email"
              name="email"
              autocomplete="email"
              required
            />
          </div>

          <div id="resetMessage" class="alert" style="display:none;font-weight:bold;margin-top:1rem;"></div>

          <div class="form-actions">
            <button type="submit" class="btn-large btn-block btn-cta" id="submitReset">
              Link anfordern
            </button>
          </div>

          <p style="text-align:center;margin-top:1.5rem;font-size:1rem;">
            <a href="/login.html">Zurück zum Login</a>
          </p>
          <p style="text-align:center;margin-top:0.75rem;font-size:0.98rem;color:var(--muted);">
            Wenn etwas nicht klappt, schreib uns: <a href="mailto:poolparty.jupeters@gmail.com">poolparty.jupeters@gmail.com</a>
          </p>
        </div>
      </form>
    </div>

    <script type="module">
      import { requestPasswordReset } from './js/api/auth.js';
      import { ApiError } from './js/api/client.js';

      const form = document.getElementById('resetRequestForm');
      const messageEl = document.getElementById('resetMessage');
      const submitBtn = document.getElementById('submitReset');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        messageEl.style.display = 'none';
        submitBtn.disabled = true;
        const originalLabel = submitBtn.innerText;
        submitBtn.innerText = 'Wird gesendet…';

        const email = document.getElementById('emailInput').value.trim();

        try {
          await requestPasswordReset(email);
          messageEl.style.color = 'var(--success)';
          messageEl.textContent =
            'Wenn ein Konto mit dieser E-Mail existiert, ist eine Nachricht unterwegs. ' +
            'Schau auch im Spam-Ordner nach.';
          messageEl.style.display = 'block';
          form.querySelector('#emailInput').value = '';
        } catch (err) {
          messageEl.style.color = 'var(--accent)';
          messageEl.textContent =
            err instanceof ApiError ? err.message : 'Unbekannter Fehler.';
          messageEl.style.display = 'block';
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = originalLabel;
        }
      });
    </script>
  </body>
</html>
