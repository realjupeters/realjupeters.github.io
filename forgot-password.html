<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Passwort vergessen · JP Poolparty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap" />
    <link rel="stylesheet" href="css/scrapbook.css?v=20261110" />
    <link rel="stylesheet" href="css/auth.css?v=20261110" />
    <meta name="theme-color" content="#fdfbf7" />
    <meta name="api-base" content="https://jpcore.logge.top" />
  </head>
  <body class="auth-page">
    <nav class="split-nav">
      <div class="nav-brand">
        <h3><a href="/">JP Poolparty</a></h3>
      </div>
    </nav>

    <main class="auth-main">
    <div class="auth-card">
        <h1 class="caption">Passwort vergessen</h1>

      <form id="resetRequestForm" novalidate>
        <div class="form-section">
          <p class="auth-intro">
            Trag deine E-Mail ein. Wenn ein Konto existiert, schicken wir dir einen
            Link zum Zurücksetzen (gültig 1 Stunde).
          </p>

          <div class="form-group">
            <label for="emailInput">E-Mail</label>
            <input
              id="emailInput"
              class="input-block"
              type="email"
              name="email"
              autocomplete="email"
              required
            />
          </div>

          <div id="resetMessage" class="alert auth-message" role="status" style="display:none"></div>

          <div class="form-actions">
            <button type="submit" class="btn-large btn-block btn-cta" id="submitReset">
              Link anfordern
            </button>
          </div>

          <p class="auth-links">
            <a href="/login.html">Zurück zum Login</a>
          </p>
          <p class="auth-help">
            Wenn etwas nicht klappt, schreib uns: <a href="mailto:poolparty.jupeters@gmail.com">poolparty.jupeters@gmail.com</a>
          </p>
        </div>
      </form>
    </div>
    </main>

    <script type="module">
      import { requestPasswordReset } from './js/api/auth.js';
      import { ApiError } from './js/api/client.js';

      const form = document.getElementById('resetRequestForm');
      const messageEl = document.getElementById('resetMessage');
      const submitBtn = document.getElementById('submitReset');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        messageEl.style.display = 'none';
        submitBtn.disabled = true;
        const originalLabel = submitBtn.innerText;
        submitBtn.innerText = 'Wird gesendet…';

        const email = document.getElementById('emailInput').value.trim();

        try {
          await requestPasswordReset(email);
          messageEl.style.color = 'var(--success)';
          messageEl.textContent =
            'Wenn ein Konto mit dieser E-Mail existiert, ist eine Nachricht unterwegs. ' +
            'Schau auch im Spam-Ordner nach.';
          messageEl.style.display = 'block';
          form.querySelector('#emailInput').value = '';
        } catch (err) {
          messageEl.style.color = 'var(--accent)';
          messageEl.textContent =
            err instanceof ApiError ? err.message : 'Unbekannter Fehler.';
          messageEl.style.display = 'block';
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = originalLabel;
        }
      });
    </script>
  </body>
</html>
